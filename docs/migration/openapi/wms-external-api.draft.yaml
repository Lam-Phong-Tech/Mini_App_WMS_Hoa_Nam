components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Client gửi `Authorization: Bearer <token>`.
        Token lấy theo thứ tự (wms-link-context.ts:141-152):
          1. accessToken trong link context (query param)
          2. sessionStorage['miniapp_wms_access_token']
          3. localStorage['miniapp_warehouse_session_token']
        ❓ Định dạng token (JWT? opaque?) và TTL phía server CHƯA XÁC MINH.

  parameters:
    DocumentIdPath:
      { name: id, in: path, required: true, schema: { type: string }, description: '❓ Định dạng CHƯA XÁC MINH (UUID? chuỗi?)' }

    IfMatchHeader:
      name: If-Match
      in: header
      required: false
      schema: { type: string }
      description: |
        ❓ NGỮ NGHĨA CHƯA XÁC MINH.
        Client coi đây là "version" của chứng từ và BÁO LỖI nếu không lấy được
        (scan.service.ts:490, 1066). Nhưng KHÔNG CÓ BẰNG CHỨNG server dùng nó
        để kiểm soát đồng thời (optimistic concurrency).

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: |
        🔴 KHÔNG CÓ BẰNG CHỨNG SERVER HỖ TRỢ HEADER NÀY.
        Client gửi ở 18 vị trí — đó là bằng chứng về Ý ĐỊNH PHÍA CLIENT,
        KHÔNG phải hành vi phía server.
        Ngoài ra, 10/18 vị trí sinh key MỚI ngay tại lời gọi
        (generateClientScanId() = crypto.randomUUID()), nên kể cả khi server
        có hỗ trợ thì việc thử lại vẫn KHÔNG idempotent.
        Xem 01-api-inventory.md §5.
      x-server-support: UNKNOWN
      x-blocking-question: Q9

  responses:
    UnauthorizedInferred:
      description: |
        Suy ra từ hành vi client: api-client.ts:338 gọi notifyMiniSessionExpired()
        khi status 401, và notifyMiniPermissionDenied() khi 403.
      content: { application/json: { schema: { $ref: '#/components/schemas/WmsEnvelope' } } }

    UnknownError:
      description: |
        ❓ Danh mục mã lỗi CHƯA XÁC MINH.
        Client đọc error_code từ payload.error_code HOẶC payload.error.code
        (api-client.ts:319-322) — dấu hiệu shape lỗi không nhất quán.
      content: { application/json: { schema: { $ref: '#/components/schemas/WmsEnvelope' } } }

  schemas:
    WmsEnvelope:
      type: object
      description: 'Envelope client kỳ vọng — src/services/scan.service.ts:38-46'
      properties:
        success:    { type: boolean }
        message:    { type: string }
        data:       { description: 'any — client không ràng buộc kiểu' }
        meta:       { description: unknown }
        error_code: { type: string }
        code:       { type: string, description: '⚠️ Trường thứ hai cho mã lỗi — trùng lặp' }
        error:      { type: string, description: '⚠️ Trường thứ ba — có thể là string HOẶC object có .code' }

    AuthEnvelope:
      type: object
      description: |
        ⚠️ Client chấp nhận ÍT NHẤT 8 vị trí khác nhau cho token và 5 vị trí
        cho user (zalo-auth.service.ts:18-41, 128-168). Đây là dấu hiệu mạnh
        cho thấy contract thật CHƯA ĐƯỢC BIẾT RÕ, không phải API linh hoạt.
      properties:
        success:            { type: boolean }
        message:            { type: string }
        staff:              { type: object }
        user:               { type: object }
        data:               { type: object, description: 'Có thể lồng staff/user/token bên trong' }
        session_token:      { type: string }
        session_expires_at: { type: string, format: date-time }
        access_token:       { type: string }
        token:              { type: string }
        refresh_token:      { type: string }
        token_type:         { type: string }
        expires_in:         { type: integer }
        expires_at:         { type: string, format: date-time }

# ============================================================================
#  DANH SÁCH CHƯA THỂ XÁC MINH — xem đầy đủ tại 01-api-inventory.md §4
