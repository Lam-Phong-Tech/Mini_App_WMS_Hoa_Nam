openapi: 3.1.0

# ============================================================================
#  ⚠️⚠️  TRẠNG THÁI: CLIENT_EXPECTED_CONTRACT — ĐỘ TIN CẬY THẤP  ⚠️⚠️
#
#  ĐÂY KHÔNG PHẢI HỢP ĐỒNG API CHÍNH THỨC VÀ KHÔNG ĐƯỢC DÙNG THAY THẾ.
#
#  ĐƯỢC DÙNG ĐỂ : sinh types/interfaces · tạo API adapter ·
#                 tạo mock server/fixtures · viết contract test PHÍA CLIENT
#  KHÔNG ĐƯỢC   : coi là bằng chứng server hỗ trợ endpoint/payload/idempotency/
#                 conflict handling · gọi mutation thật · offline mutation ·
#                 retry request ghi · Post Receipt/Post Issue
#  GATE CHẶN    : GATE_WMS_API_INTEGRATION
#
#  Mức xác minh : [I-FE] — CHỈ suy ra từ CALL-SITE ở frontend.
#                 KHÔNG có route/controller nào của server trong repository.
#                 KHÔNG có OpenAPI/Swagger/Postman ở bất kỳ đâu
#                 (đã tìm toàn ổ đĩa, kể cả .tmp/ — 0 kết quả).
#
#  Vì vậy, những thứ sau đây LÀ SUY ĐOÁN, KHÔNG PHẢI SỰ THẬT:
#    - Tên trường và kiểu dữ liệu trong request/response
#    - Trường nào bắt buộc / tuỳ chọn
#    - Danh mục mã lỗi đầy đủ
#    - Quy tắc phân trang
#    - Server có xử lý Idempotency-Key hay không   <-- KHÔNG CÓ BẰNG CHỨNG
#    - Ngữ nghĩa If-Match / versioning              <-- KHÔNG CÓ BẰNG CHỨNG
#    - Mã HTTP trả về cho từng trường hợp
#
#  Chỉ những thứ sau là CHẮC CHẮN (quan sát được ở phía client):
#    - Method + path mà frontend GỌI
#    - Header mà frontend GỬI
#    - Query param mà frontend DỰNG
#    - Shape mà frontend KỲ VỌNG khi đọc response
#
#  Nguồn: src/services/*.ts tại commit 663114aff6804e50b77b88e05dda9f9c784d6fff
# ============================================================================

info:
  title: WMS Hoa Nam — External Backend — CLIENT_EXPECTED_CONTRACT
  version: 0.0.0-client-expected
  summary: Kỳ vọng của client suy từ call-site. KHÔNG phải contract của server.
  description: |
    Tài liệu này mô tả những gì FRONTEND TIN LÀ ĐÚNG về API, không phải
    những gì SERVER THỰC SỰ LÀM. Mọi mục cần chủ sở hữu WMS API nghiệm thu
    trong GATE_WMS_API_INTEGRATION.

    ĐƯỢC DÙNG ĐỂ (đã phê duyệt 2026-09-04):
      - sinh types / interfaces
      - tạo API adapter
      - tạo mock server / fixtures
      - viết contract test PHÍA CLIENT
      - lập câu hỏi cho đội backend, ước lượng khối lượng

    KHÔNG ĐƯỢC DÙNG ĐỂ:
      - khẳng định server hỗ trợ endpoint, payload, idempotency hay conflict handling
      - gọi mutation thật
      - triển khai offline mutation
      - retry request ghi dữ liệu
      - Post Receipt / Post Issue
  x-verification-status: CLIENT_EXPECTED_CONTRACT
  x-confidence: LOW
  x-approved-uses:
    - generate-types-and-interfaces
    - build-api-adapter
    - build-mock-server-and-fixtures
    - write-client-side-contract-tests
  x-forbidden-uses:
    - evidence-that-server-supports-endpoint-or-payload
    - evidence-of-server-side-idempotency
    - evidence-of-conflict-handling
    - calling-real-mutations
    - implementing-offline-mutations
    - retrying-write-requests
  x-blocking-gate: GATE_WMS_API_INTEGRATION
  x-verified-by: [frontend-call-site-reading]
  x-not-verified-by: [server-source, live-call, official-spec, vendor-documentation]
  x-source-commit: 663114aff6804e50b77b88e05dda9f9c784d6fff
  x-blocking-question: Q9

