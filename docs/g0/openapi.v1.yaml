        - type: object
          properties:
            success: { const: true }
            data: { $ref: '#/components/schemas/ProductDetail' }
            error_code: { type: 'null' }
            errors: { type: 'null' }
    FacetsEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            success: { const: true }
            data:
              type: array
              items: { $ref: '#/components/schemas/Facet' }
            error_code: { type: 'null' }
            errors: { type: 'null' }
    QuoteAcceptedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            success: { const: true }
            data: { $ref: '#/components/schemas/QuoteAccepted' }
            error_code: { type: 'null' }
            errors: { type: 'null' }
    HealthVersionEnvelope:
      allOf:
